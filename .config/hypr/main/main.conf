# Hyprland Config.

# CoreCat's stuff.
monitor=,preferred,auto,1
# monitor = eDP-1, 1920x2400, 0x0, 1
# monitor = eDP-1, 1280x720, 0x0, 1
#monitor = HDMI-A-2, 1920x1080, 1920x0, 1
monitor = eDP-1, 1920x1080, 0x0, 1
monitor = HDMI-A-2, 1920x1080, 0x0, 1, mirror, eDP-1

$using_blur = false

debug {
#	overlay = true
}

input {
    # Keyboard: Add a layout and uncomment kb_options for Win+Space switching shortcut
    kb_layout = us
    # kb_options = grp:win_space_toggle
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35

    touchpad {
        natural_scroll = true
        disable_while_typing = false
        clickfinger_behavior = true
        scroll_factor = 1
    }
    special_fallthrough = true
    follow_mouse = 1
}

binds {
    # focus_window_on_workspace_c# For Auto-run stuff see execs.confhange = true
    scroll_event_delay = 0
}

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.15
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_create_new = true
}

gesture = 3, horizontal, workspace
gesture = 3, up, special, special

general {
    gaps_in = 5
    gaps_out = 10
    gaps_workspaces = 60
    border_size = 1

    resize_on_border = false
    no_focus_fallback = true
    layout = dwindle
    
    allow_tearing = true
}

dwindle {
	preserve_split = true
	smart_split = false
	smart_resizing = false
}

decoration {
    #screen_shader = /home/corecat/.config/hypr/shaders/drugs.frag
    rounding = 20
	blur {
        enabled = $using_blur
        xray = false
        contrast = 1
        brightness = 0.9
        size = 8
        passes = 1
        new_optimizations = true
        ignore_opacity=true
        popups = true
	}
	shadow {
		enabled = true
		range = 20
		render_power = 4
		color = 0x50000000
	}
}

animations {
    enabled = true

    bezier = outcubic, 0.33, 1, 0.68, 1

    animation = windows, 1, 2.8, outcubic, popin 60%
    animation = windowsIn, 1, 2.8, outcubic, popin 60%
    animation = windowsOut, 1, 2.8, outcubic, popin 60%

    animation = border, 1, 10, outcubic
    animation = fade, 1, 2.4, outcubic

    animation = layersIn, 1, 2.4, outcubic, slide
    animation = layersOut, 1, 1.7, outcubic

    animation = fadeLayersIn, 1, 2.0, outcubic
    animation = fadeLayersOut, 1, 2.2, outcubic

    animation = workspaces, 1, 4.0, outcubic, slide
    animation = specialWorkspace, 1, 3.0, outcubic, slidevert
}

misc {
    vfr = 1
    vrr = 1
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    enable_swallow = false
    swallow_regex = (foot|kitty|allacritty|Alacritty)
    
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    new_window_takes_over_fullscreen = 2
    allow_session_lock_restore = true
    middle_click_paste = false 
    initial_workspace_tracking = false
    enable_anr_dialog = false
    session_lock_xray = true
}